name: Install-hook watch

# Daily check for exp-install-hook-watch-prospective (28 days, public npm
# registry data only). The script stops by itself once the watch has ended.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-hook-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/experiments/install-hook-watch.ts
      - name: Commit watch state
        run: |
          git config user.name "venture-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/experiments/exp-install-hook-watch-prospective
          git diff --cached --quiet && exit 0
          git commit -m "experiment: install-hook watch daily check"
          git pull --rebase origin main
          git push origin HEAD:main
